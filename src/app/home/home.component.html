<div class="container mt-5">
  <div class="page-header">
    <h1>🎄 Advent of Code</h1>
    <p>Pick a year to see how many stars have been earned so far.</p>
  </div>
  <div class="row">
    @for (info of yearInfo; track info) {
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body text-center">
            <h5 class="card-title">
              {{info.year}}
              <span class="badge-gold"><span class="star-glyph" aria-hidden="true">★</span>{{info.stars}}</span>
            </h5>
            <p class="card-text">Days completed: {{info.days}}/{{info.year >= 2025 ? 12 : 25}}</p>
            <a [routerLink]="['/year', info.year]" class="btn-ascii">[ View {{info.year}} ]</a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
