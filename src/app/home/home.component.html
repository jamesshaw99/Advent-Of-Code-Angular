<div class="container mt-5">
  <div class="page-header">
    <h1>🎄 Advent of Code</h1>
    <p>Pick a year to see how many stars have been earned so far.</p>
  </div>
  <div class="row">
    @for (info of yearInfo; track info) {
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body text-center">
            <h5 class="card-title">
              {{info.year}}
              <span class="badge-gold"><mat-icon>star</mat-icon>{{info.stars}}</span>
            </h5>
            <p class="card-text">Days completed: {{info.days}}/{{info.year >= 2025 ? 12 : 25}}</p>
            <a href="/year/{{info.year}}" class="btn btn-primary">View {{info.year}}</a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
