<div class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand" routerLink="/">🎄 Advent of Code</a>
    <button class="navbar-toggler" type="button" (click)="toggleNav()" [attr.aria-expanded]="isNavOpen" aria-controls="navbarNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="isNavOpen" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        @for (info of yearInfo; track info) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="['/year', info.year]">
              {{info.year}}
              <span class="badge-gold"><span class="star-glyph" aria-hidden="true">★</span>{{info.stars}}</span>
            </a>
          </li>
        }
      </ul>
      <button class="theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-pressed]="isDarkMode" aria-label="Toggle dark mode">
        {{ isDarkMode ? '☾' : '☀' }}
      </button>
    </div>
  </nav>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer class="text-center">
    <p class="mb-0">❄️ Made for Advent of Code</p>
  </footer>
</div>
