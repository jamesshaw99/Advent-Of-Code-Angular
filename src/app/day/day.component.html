<div class="container mt-5">
  @if (vm$ | async; as vm) {
    <button class="btn btn-secondary mb-3" (click)="goBack()">← Back to Year Overview</button>

    <div class="page-header">
      <h1>{{ vm.challengeInfo?.title }}</h1>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Part One</h5>
        <div class="prose" [innerHTML]="vm.challengeInfo?.part1Description ?? ''"></div>
        <h5 class="card-title mt-4">
          Solution
          <span class="badge-time">{{ vm.result?.timePart1 }}ms</span>
        </h5>
        <p class="challenge-result">{{ vm.result?.part1 }}</p>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Part Two</h5>
        <div class="prose" [innerHTML]="vm.challengeInfo?.part2Description ?? ''"></div>
        <h5 class="card-title mt-4">
          Solution
          <span class="badge-time">{{ vm.result?.timePart2 }}ms</span>
        </h5>
        <p class="challenge-result">{{ vm.result?.part2 }}</p>
      </div>
    </div>
  }
</div>
